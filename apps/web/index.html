<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuiteFlow · Automatisation Facebook & Instagram avec l'IA</title>
    <meta
      name="description"
      content="SuiteFlow répond à vos commentaires et messages Facebook et Instagram 24h/24 grâce à son assistant IA : leads, lives, Marketplace et planification au même endroit."
    />
    <meta name="theme-color" content="#f05a1a" />
    <!-- Aperçu du lien partagé (Facebook, WhatsApp, Messenger…) -->
    <meta property="og:title" content="SuiteFlow · Automatisation Facebook & Instagram avec l'IA" />
    <meta property="og:description" content="Un assistant IA qui répond à vos clients sur Facebook et Instagram, 24h/24." />
    <meta property="og:image" content="/brand/suiteflow-icon-1024.png" />
    <!-- Version simplifiée du logo, nette en 16 px -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,400&family=Sora:wght@500;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />
    <script>
      // Pose le thème avant le premier rendu pour éviter un flash de la mauvaise couleur.
      // Par défaut le thème suit l'appareil (clair / sombre) ; « replika:theme » = light | dark le force (voir lib/themePref.ts).
      (function () {
        var pref = localStorage.getItem("replika:theme");
        if (pref !== "light" && pref !== "dark") pref = "auto";
        var theme = pref === "auto" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
        document.documentElement.setAttribute("data-theme-pref", pref);
        var accent = localStorage.getItem("replika:accentTheme") === "classic" ? "classic" : "whatsapp";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-accent", accent);
        // Police du texte (réglage de cet appareil) : « satoshi » ou « system » ; sinon Inter
        var font = localStorage.getItem("replika:font");
        if (font === "satoshi" || font === "system") document.documentElement.setAttribute("data-font", font);
        if (font === "satoshi") {
          ["Satoshi-500", "CabinetGrotesk-800"].forEach(function (f) {
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous"; l.href = "/fonts/" + f + ".woff2";
            document.head.appendChild(l);
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
