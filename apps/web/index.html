<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuiteFlow · Automatisation Facebook & Instagram avec l'IA</title>
    <meta
      name="description"
      content="SuiteFlow répond à vos commentaires et messages Facebook et Instagram 24h/24 grâce à son assistant IA : leads, lives, Marketplace et planification au même endroit."
    />
    <meta name="theme-color" content="#008069" />
    <!-- Aperçu du lien partagé (Facebook, WhatsApp, Messenger…) -->
    <meta property="og:title" content="SuiteFlow · Automatisation Facebook & Instagram avec l'IA" />
    <meta property="og:description" content="Un assistant IA qui répond à vos clients sur Facebook et Instagram, 24h/24." />
    <meta property="og:image" content="/brand/suiteflow-icon-1024.png" />
    <!-- Version simplifiée du logo, nette en 16 px -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@500;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />
    <script>
      // Pose le thème avant le premier rendu pour éviter un flash de la mauvaise couleur.
      // Source de vérité : préférences serveur (synchronisées ici par useThemeAttrs à la connexion).
      (function () {
        var theme = localStorage.getItem("replika:darkMode") === "1" ? "dark" : "light";
        var accent = localStorage.getItem("replika:accentTheme") === "classic" ? "classic" : "whatsapp";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-accent", accent);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
